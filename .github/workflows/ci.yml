name: ChurnGuard CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Installation de Python 3.12
        run: uv python install 3.12

      - name: Installation des dépendances
        run: uv sync --frozen

      - name: Vérification des imports src/
        run: |
          uv run python -c "from src.preprocessing import preprocess; print('preprocessing OK')"
          uv run python -c "from src.features import add_features; print('features OK')"
          uv run python -c "from src.evaluate import compute_metrics; print('evaluate OK')"

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build et push image API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/churnguard-api:latest

      - name: Build et push image Streamlit
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.streamlit
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/churnguard-streamlit:latest